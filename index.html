<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI School & Study Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 650px; background: #1e1e1e; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; height: 85vh; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .chat-header { padding: 20px; border-bottom: 1px solid #333; background: #252526; border-radius: 10px 10px 0 0; }
        .chat-header h2 { font-size: 1.2rem; color: #ffffff; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
        .user { background: #0e639c; color: #ffffff; align-self: flex-end; }
        .bot { background: #2d2d2d; color: #d4d4d4; align-self: flex-start; border: 1px solid #3c3c3c; }
        .input-box { display: flex; gap: 10px; padding: 15px; border-top: 1px solid #333; background: #252526; border-radius: 0 0 10px 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3c3c3c; background: #1e1e1e; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #0e639c; }
        button { padding: 12px 24px; border: none; background: #0e639c; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1177bb; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>AI School & Study Assistant</h2>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const userData = {
        user_id: "usr_101",
        weak_courses: ["Physics", "Mathematics"],
        busy_hours: { "Monday": ["08:30-15:30", "18:00-19:00"] },
        daily_target_hours: 2
    };

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        input.value = "";

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_data: userData,
                    message: message,
                    mode_instruction: "Respond in English. Be clear, direct, and supportive."
                })
            });
            const data = await response.json();
            appendMessage(data.response, "bot");
        } catch (error) {
            appendMessage("An error occurred while connecting to the server.", "bot");
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
